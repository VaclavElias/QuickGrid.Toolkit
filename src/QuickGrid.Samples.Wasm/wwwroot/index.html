<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickGrid.Toolkit Samples</title>
    <base href="/" />
    <!-- Same Bootstrap version as the Server head bundles locally (5.3.3), served from CDN here to keep the static site lean. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="_content/QuickGrid.Samples.Shared/app.css" />
    <link rel="stylesheet" href="_content/QuickGrid.Toolkit/app.css" />
    <link rel="stylesheet" href="QuickGrid.Samples.Wasm.styles.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" href="favicon.png" />
</head>

<body>
    <div id="app">
        <div class="d-flex align-items-center justify-content-center" style="height: 100vh;">
            <div class="text-center">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-3 text-muted">Loading QuickGrid.Toolkit samples…</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" class="alert alert-warning position-fixed bottom-0 start-0 end-0 mb-0" style="display: none;">
        An unhandled error has occurred.
        <a href="." class="alert-link">Reload</a>
        <span class="float-end" style="cursor: pointer;" onclick="this.parentElement.style.display='none'">🗙</span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

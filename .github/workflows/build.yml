name: Build

# Documentation-only changes don't affect the build, so they don't trigger it.
# (README.md is packed into the NuGet package, but nothing is published from CI, so skipping is safe.)
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE.txt'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE.txt'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build (warnings as errors)
        run: dotnet build QuickGrid.Toolkit.slnx --configuration Release /warnaserror

      - name: Test
        run: dotnet test QuickGrid.Toolkit.slnx --configuration Release --no-build --verbosity normal

      - name: Pack (verify packaging stays valid; nothing is published)
        run: dotnet pack src/QuickGrid.Toolkit/QuickGrid.Toolkit.csproj --configuration Release --no-build --output ./artifacts
